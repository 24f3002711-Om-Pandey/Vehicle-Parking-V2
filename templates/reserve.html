{% extends "base.html" %}
{% block title %}Reserve Spot{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-lg shadow-lg">
    <h2 class="text-2xl font-bold mb-6 text-center">Reserve a Spot at {{ lot.Prime_location_name }}</h2>
    <form method="POST">
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Parking Time</label>
            <input type="datetime-local" name="parking_time" value="{{ parking_time_str|default('') }}" class="w-full border rounded-md py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Leaving Time</label>
            <input type="datetime-local" name="leaving_time" value="{{ leaving_time_str|default('') }}" class="w-full border rounded-md py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 font-semibold mb-2">Number of Spots</label>
            <select name="num_spots" class="w-full border rounded-md py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                {% set max_spots = 5 %}
                {% for i in range(1, max_spots+1) %}
                    <option value="{{ i }}">{{ i }}</option>
                {% endfor %}
            </select>
            <small style="color:#888;">(You can reserve up to 5 spots at once. Contact admin for more.)</small>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition-all duration-300">Reserve</button>
    </form>
</div>
{% endblock %}
