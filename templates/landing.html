{% extends "base.html" %}
{% block title %}Welcome to Park-it{% endblock %}
{% block content %}
<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh;">
    <h1 style="font-size:2.5em; font-weight:bold; margin-bottom:24px; color:#2563eb; text-align:center;">
        Welcome to Park-it
    </h1>
    <p style="margin-bottom:32px; font-size:1.2em; color:#444; text-align:center;">
        Please login or register to book your parking spot.
    </p>
    <div style="display:flex; gap:24px;">
        <a href="{{ url_for('main.login') }}" class="btn" style="background:#2563eb; color:#fff; padding:14px 38px; border-radius:6px; font-weight:bold; text-decoration:none; font-size:1.1em; box-shadow:0 2px 8px rgba(37,99,235,0.12); border:none;">
            Login
        </a>
        <a href="{{ url_for('main.register') }}" class="btn" style="background:#10b981; color:#fff; padding:14px 38px; border-radius:6px; font-weight:bold; text-decoration:none; font-size:1.1em; box-shadow:0 2px 8px rgba(16,185,129,0.10); border:none;">
            Register
        </a>
    </div>
</div>
{% endblock %}
