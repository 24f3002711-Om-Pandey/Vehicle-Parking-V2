{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div style="background: #fff; padding: 36px 32px 28px 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); width: 100%; max-width: 350px;">
        <h2 style="font-size: 2em; font-weight: bold; color: #222; margin-bottom: 24px; text-align: center;">Login</h2>
        <form method="POST" action="{{ url_for('main.login') }}">
            <label for="Username" style="display: block; color: #444; font-weight: 600; margin-bottom: 6px;">Username</label>
            <input type="text" id="Username" name="Username" style="width: 100%; padding: 10px; border: 1px solid #bbb; border-radius: 4px; margin-bottom: 18px;" required>
            <label for="Password" style="display: block; color: #444; font-weight: 600; margin-bottom: 6px;">Password</label>
            <input type="password" id="Password" name="Password" style="width: 100%; padding: 10px; border: 1px solid #bbb; border-radius: 4px; margin-bottom: 22px;" required>
            <button type="submit" class="btn" style="width: 100%; background: #2563eb; color: #fff; font-weight: bold; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; margin-top: 10px;">
                Login
            </button>
        </form>
        <p style="text-align: center; color: #666; font-size: 0.97em; margin-top: 18px;">
            Don't have an account?
            <a href="{{ url_for('main.register') }}" style="color: #2563eb; text-decoration: underline;">Register here</a>.
        </p>
    </div>
</div>
{% endblock %}
