{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="flex items-center justify-center min-h-full">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">Register</h2>
        <form method="POST" action="{{ url_for('main.register') }}">
            <div class="mb-4">
                <label for="Username" class="block text-gray-700 text-sm font-semibold mb-2">Username</label>
                <input type="text" id="Username" name="Username" value="{{ username|default('') }}" class="shadow-sm appearance-none border rounded-md w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div class="mb-4">
                <label for="Password" class="block text-gray-700 text-sm font-semibold mb-2">Password</label>
                <input type="password" id="Password" name="Password" class="shadow-sm appearance-none border rounded-md w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div class="mb-4">
                <label for="Name" class="block text-gray-700 text-sm font-semibold mb-2">Name</label>
                <input type="text" id="Name" name="Name" value="{{ name|default('') }}" class="shadow-sm appearance-none border rounded-md w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div class="mb-6">
                <label for="Email" class="block text-gray-700 text-sm font-semibold mb-2">Email</label>
                <input type="email" id="Email" name="Email" value="{{ email|default('') }}" class="shadow-sm appearance-none border rounded-md w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-300">Register</button>
        </form>
        <p class="text-center text-gray-600 text-sm mt-4">
            Already have an account? <a href="{{ url_for('main.login') }}" class="text-blue-600 hover:underline">Login here</a>.
        </p>
    </div>
</div>
{% endblock %}
